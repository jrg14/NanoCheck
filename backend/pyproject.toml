[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocheck"
version = "0.1.0"
description = "Backend para monitorizacion y analisis de endpoints HTTP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Jrg14", email = "example@email.com"}
]
dependencies = [
    "fastapi[all]==0.135.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.11.0",
    "SQLAlchemy==2.0.49",
    "python-dotenv==1.2.2",
    "psycopg==3.3.3"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.14",
    "pre-commit==4.5.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Habilitamos:
# E: pycodestyle (errores)
# F: Pyflakes
# I: Isort (esto es lo que ordena los imports alfabéticamente)
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
# Configuración para que los imports se agrupen
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
# Configuración del formateador
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
